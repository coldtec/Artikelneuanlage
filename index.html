<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAP Artikel Export Tool</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#0b0f14; --card:#121a24; --field:#0a0f16; --text:#e9eef6;
  --muted:#9fb0c7; --border:#223246; --cyan:#40c9ff; --green:#35d07f;
  --red:#ff5a6b;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--text);
  font-family:Inter,Segoe UI,Arial,sans-serif;
}
.wrap{max-width:920px;margin:0 auto;padding:48px 20px 70px}
.header{text-align:left;margin-bottom:26px}
.tool-label{
  color:#00e5e5;font-size:13px;font-weight:800;letter-spacing:1.5px;
  margin-bottom:14px;
}
.header h1{margin:0 0 12px;font-size:34px;font-weight:800;color:#fff}
.header p{margin:0;color:#9fc5dc;font-size:15px}
.card{
  background:var(--card); border:1px solid var(--border); border-radius:14px;
  padding:22px; box-shadow:0 12px 34px rgba(0,0,0,.18);
}
.drop{
  display:block; border:2px dashed #29435a; border-radius:14px; padding:42px 22px;
  text-align:center; cursor:pointer; background:var(--field); transition:.18s;
}
.drop:hover,.drop.drag{border-color:var(--cyan);background:#0d1821}
.drop strong{display:block;font-size:19px;margin-bottom:8px}
.drop span{color:var(--muted)}
input[type=file]{display:none}
.fileinfo{
  display:none; margin-top:16px; padding:13px 15px; border-radius:10px;
  background:#0d171f; border:1px solid var(--border);
}
.fileinfo.ok{display:block;border-color:#235d43}
.status{margin-top:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{
  background:var(--field);border:1px solid var(--border);border-radius:10px;
  padding:13px;text-align:center
}
.stat b{display:block;font-size:19px;margin-top:4px}
.stat span{font-size:12px;color:var(--muted)}
.actions{margin-top:20px}
button{
  width:100%; border:0; border-radius:11px; padding:14px 18px;
  background:var(--cyan); color:#041018; font-weight:800; font-size:15px;
  cursor:pointer; transition:.15s;
}
button:hover{filter:brightness(1.08)}
button:disabled{opacity:.35;cursor:not-allowed}
.message{margin-top:14px;color:var(--muted);font-size:14px;text-align:center}
.message.error{color:var(--red)}
.results{display:none;margin-top:22px}
.results.show{display:block}
.results h2{font-size:18px;margin:0 0 14px}
.downloads{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.download{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  text-decoration:none;color:var(--text);padding:14px 15px;border-radius:11px;
  background:var(--field);border:1px solid #235d43;
}
.download:hover{border-color:var(--green)}
.download small{display:block;color:var(--muted);margin-top:3px}
.badge{color:var(--green);font-weight:800}
.note{margin-top:16px;color:var(--muted);font-size:12px;text-align:center}
@media(max-width:700px){
  .status,.downloads{grid-template-columns:1fr}
  .wrap{padding-top:28px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="tool-label">COLDTEC TOOL</div>
    <h1>Artikelimport</h1>
    <p>Artikel mit Nummern vergeben und Dateien für den Import bereit machen</p>
  </div>

  <div class="card">
    <label class="drop" id="drop">
      <input id="file" type="file" accept=".xlsx,.xls">
      <strong>Excel-Datei hier einfügen</strong>
      <span>Datei hineinziehen oder klicken</span>
    </label>

    <div class="fileinfo" id="fileinfo"></div>

    <div class="status">
      <div class="stat"><span>Blatt</span><b id="sheetStatus">–</b></div>
      <div class="stat"><span>Artikel erkannt</span><b id="countStatus">–</b></div>
      <div class="stat"><span>Prüfung</span><b id="checkStatus">–</b></div>
    </div>

    <div class="actions">
      <button id="createBtn" disabled>Dateien erstellen</button>
    </div>
    <div class="message" id="message">Noch keine Datei hochgeladen.</div>

    <div class="results" id="results">
      <h2>Exportdateien <span style="font-weight:400;color:var(--muted)">(Bitte Dateien downloaden)</span></h2>
      <div class="downloads" id="downloads"></div>
      <div class="note">Leere Zeilen werden nicht exportiert.</div>
    </div>
  </div>
</div>

<script>
const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');
const createBtn = document.getElementById('createBtn');
const msg = document.getElementById('message');
const results = document.getElementById('results');
const downloads = document.getElementById('downloads');
let sourceRows = null;

['dragenter','dragover'].forEach(ev => drop.addEventListener(ev,e=>{
  e.preventDefault(); drop.classList.add('drag');
}));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev,e=>{
  e.preventDefault(); drop.classList.remove('drag');
}));
drop.addEventListener('drop',e=>{
  const f=e.dataTransfer.files[0];
  if(f) loadFile(f);
});
fileInput.addEventListener('change',()=>fileInput.files[0] && loadFile(fileInput.files[0]));

function cellValue(v){
  if(v === null || v === undefined) return '';
  return v;
}
function isBlankRow(row){
  return !row || row.every(v => v === '' || v === null || v === undefined);
}
function safeText(v){
  if(v === null || v === undefined) return '';
  return String(v).replace(/\t/g,' ').replace(/\r?\n/g,' ');
}
function rowsToTxt(rows){
  return '\uFEFF' + rows.map(r => r.map(safeText).join('\t')).join('\r\n');
}
function downloadBlob(name, blob, description){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.className='download';
  a.href=url; a.download=name;
  a.innerHTML=`<div><b>${name}</b></div><div class="badge">Download</div>`;
  downloads.appendChild(a);
}
function xlsxBlob(rows, sheetName='Tabelle1'){
  const ws=XLSX.utils.aoa_to_sheet(rows);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,sheetName);
  const data=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  return new Blob([data],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

async function loadFile(file){
  results.classList.remove('show'); downloads.innerHTML='';
  createBtn.disabled=true; sourceRows=null;
  msg.className='message';
  try{
    const data=await file.arrayBuffer();
    // cellDates false + raw values preserve numbers as cleanly as possible.
    // SheetJS also reads cached formula results from Excel files.
    const wb=XLSX.read(data,{type:'array',cellDates:false});
    if(!wb.SheetNames.includes('Tabelle1')) throw new Error('Blatt "Tabelle1" wurde nicht gefunden.');
    const ws=wb.Sheets['Tabelle1'];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
    if(rows.length < 2) throw new Error('Keine Artikeldaten gefunden.');

    // Ab Excel-Zeile 2 alle tatsächlich befüllten Zeilen berücksichtigen.
    // Pflichtprüfung: Sobald in einer Zeile Daten vorhanden sind, muss Spalte A (Artikelnr.) gefüllt sein.
    const usedRows = rows.slice(1).filter(r => !isBlankRow(r));
    if(!usedRows.length) throw new Error('Keine Artikeldaten gefunden.');

    const missingArticleNumbers = [];
    usedRows.forEach((r, i) => {
      if(r[0] === '' || r[0] === null || r[0] === undefined){
        missingArticleNumbers.push(i + 2);
      }
    });

    if(missingArticleNumbers.length){
      const shown = missingArticleNumbers.slice(0,10).join(', ');
      const more = missingArticleNumbers.length > 10 ? ` (+${missingArticleNumbers.length-10} weitere)` : '';
      throw new Error(`Artikelnr. fehlt in Excel-Zeile(n): ${shown}${more}. Bitte zuerst korrigieren.`);
    }

    sourceRows = usedRows;

    document.getElementById('fileinfo').className='fileinfo ok';
    document.getElementById('fileinfo').innerHTML=`<b>✓ ${file.name}</b>`;
    document.getElementById('sheetStatus').textContent='Tabelle1 ✓';
    document.getElementById('countStatus').textContent=sourceRows.length;
    document.getElementById('checkStatus').textContent='OK ✓';
    msg.textContent='Datei bereit. Du kannst die Exportdateien erstellen.';
    createBtn.disabled=false;
  }catch(err){
    document.getElementById('sheetStatus').textContent='Fehler';
    document.getElementById('countStatus').textContent='–';
    document.getElementById('checkStatus').textContent='✕';
    msg.className='message error';
    msg.textContent=err.message || 'Die Datei konnte nicht gelesen werden.';
  }
}

createBtn.addEventListener('click',()=>{
  if(!sourceRows) return;
  downloads.innerHTML='';

  // PowerShell logic:
  // Artikelstamm: A:Y = indexes 0..24
  // GP-Kat: Z:AH = indexes 25..33
  // SharePoint: A + D = indexes 0 + 3
  const artikel = sourceRows.map(r => Array.from({length:25},(_,i)=>cellValue(r[i])));
  const gp      = sourceRows.map(r => Array.from({length:9}, (_,i)=>cellValue(r[i+25])));
  const share   = sourceRows.map(r => [cellValue(r[0]),cellValue(r[3])]);

  downloadBlob('SAP_Artikelstamm.txt',
    new Blob([rowsToTxt(artikel)],{type:'text/plain;charset=utf-8'}),
    'Spalten A–Y');

  downloadBlob('SAP_GP_Kat_Nr.txt',
    new Blob([rowsToTxt(gp)],{type:'text/plain;charset=utf-8'}),
    'Spalten Z–AH');

  downloadBlob('GPKat_Nr.xlsx',
    xlsxBlob(gp),
    'Spalten Z–AH als Excel');

  downloadBlob('Ordner SharePoint.xlsx',
    xlsxBlob(share),
    'Spalten A + D');

  results.classList.add('show');
  msg.textContent='Alle vier Exportdateien sind bereit.';
});
</script>
</body>
</html>
